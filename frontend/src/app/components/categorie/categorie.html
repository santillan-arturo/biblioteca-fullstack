<div>
  <h2>Seleziona una Categoria</h2>
  <p>Scegli un genere letterario per vedere i libri disponibili:</p>

  <div *ngIf="loading" style="color: #666; font-style: italic;">
    Caricamento categorie in corso...
  </div>

  <div *ngIf="errorMessage" style="color: red; padding: 10px; border: 1px solid red; background-color: #ffe6e6; border-radius: 4px; margin-bottom: 15px;">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage" style="display: flex; gap: 15px; flex-wrap: wrap;">
    <div *ngFor="let cat of categorieList" 
         [routerLink]="['/categoria', cat.id]" 
         style="padding: 20px; background-color: #f0f4f8; border: 1px solid #d0d7de; border-radius: 8px; cursor: pointer; min-width: 150px; text-align: center; font-weight: bold; transition: background-color 0.2s;"
         onmouseover="this.style.backgroundColor='#e1e8ed'"
         onmouseout="this.style.backgroundColor='#f0f4f8'">
      {{ cat.nome }}
    </div>
  </div>
</div>
