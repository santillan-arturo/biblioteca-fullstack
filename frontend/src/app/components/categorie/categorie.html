<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-dark">Biblioteca - Gestione Catalogo</h1>
    <p class="lead text-muted">Scegli un genere letterario per vedere i libri disponibili:</p>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let cat of categorie">
      <div class="card h-100 border-0 shadow-sm text-center p-3">
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h3 class="card-title fw-bold text-primary mb-3">{{ cat.nome }}</h3>
            <p class="card-text text-muted small">Esplora tutti i volumi registrati in questa sezione.</p>
          </div>
          <button (click)="selezionaCategoria(cat.id)" class="btn btn-primary w-100 py-2 mt-4 fw-bold text-uppercase">
            Vedi Libri
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
